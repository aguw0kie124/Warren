services:
  db:
    image: pgvector/pgvector:pg16
    container_name: confluence_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Compose waits on this, so `docker compose up -d --wait` returns only
      # once Postgres is actually accepting connections — not just booting.
      test: ["CMD-SHELL", "pg_isready -U postgres -d research"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
