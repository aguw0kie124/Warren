[project]
name = "confluence"
version = "0.1.0"
description = "AI-driven financial research platform over SEC EDGAR filings"
# Pinned to 3.13: torch/sentence-transformers wheel coverage for 3.14 is still thin,
# and A6 depends on both. Bump once those publish 3.14 wheels.
requires-python = ">=3.13,<3.14"

dependencies = [
    # --- Module A: data pipeline ---
    "httpx>=0.27",                  # EDGAR HTTP client
    "tenacity>=8.2",                # retry/backoff on SEC + API calls
    "psycopg[binary,pool]>=3.2",    # Postgres driver + connection pool
    "pgvector>=0.3",                # vector type adapter for psycopg3
    "pydantic>=2.7",
    "pydantic-settings>=2.3",       # env/.env config
    "beautifulsoup4>=4.12",         # filing HTML -> text
    "lxml>=5.2",                    # fast parser backend for bs4
    "langchain-text-splitters>=0.3", # recursive chunking (standalone, no full langchain)
    # 5.0 is a hard floor, not caution: embeddinggemma-300m's architecture is
    # unrecognized by earlier releases and fails at load, not at install.
    "sentence-transformers>=5.0",   # local embeddings (embeddinggemma-300m)

    # --- Module B: live data ---
    # Finnhub needs no SDK — it is plain REST over the httpx client above.
    "tavily-python>=0.5",           # web search returning extracted text, not HTML
]

# Modules C/D deps (langgraph, langchain-anthropic, fastapi) get added when
# those modules are actually built — not carried as dead weight before then.

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
