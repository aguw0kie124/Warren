[project]
name = "confluence"
version = "0.1.0"
description = "AI-driven financial research platform over SEC EDGAR filings"
# Pinned to 3.13: torch/sentence-transformers wheel coverage for 3.14 is still thin,
# and A6 depends on both. Bump once those publish 3.14 wheels.
requires-python = ">=3.13,<3.14"

dependencies = [
    # --- Module A: data pipeline ---
    "httpx>=0.27",                  # EDGAR HTTP client
    "tenacity>=8.2",                # retry/backoff on SEC + API calls
    "psycopg[binary,pool]>=3.2",    # Postgres driver + connection pool
    "pgvector>=0.3",                # vector type adapter for psycopg3
    "pydantic>=2.7",
    "pydantic-settings>=2.3",       # env/.env config
    "beautifulsoup4>=4.12",         # filing HTML -> text
    "lxml>=5.2",                    # fast parser backend for bs4
    "langchain-text-splitters>=0.3", # recursive chunking (standalone, no full langchain)
    # 5.0 is a hard floor, not caution: embeddinggemma-300m's architecture is
    # unrecognized by earlier releases and fails at load, not at install.
    "sentence-transformers>=5.0",   # local embeddings (embeddinggemma-300m)

    # --- Module B: live data ---
    # Finnhub needs no SDK — it is plain REST over the httpx client above.
    "tavily-python>=0.5",           # web search returning extracted text, not HTML

    # --- Module C: tools + agent ---
    # langchain-core carries @tool and ToolMessage (C1); the other two are the
    # graph and the model (C2). langgraph brings its own prebuilt ToolNode and
    # tools_condition, which is why the loop is ~40 lines.
    "langchain-core>=0.3",
    # 1.0 floor because of C3: `add_node(..., retry_policy=...)` has been
    # renamed across releases (it was `retry=` in the 0.x line), and this is
    # the line the retry policy was verified against.
    "langgraph>=1.0",
    "langchain-anthropic>=0.3",
    # C4b's checkpointer. A separate distribution from the `langgraph-checkpoint`
    # that arrives transitively with langgraph — that one carries the base classes
    # and the in-memory saver; only this one carries PostgresSaver.
    # 3.1 is a real floor: the serializer's `allowed_msgpack_modules` argument,
    # which is how app/agent.py registers Citation for checkpoint round-trips,
    # does not exist in the 2.x line.
    "langgraph-checkpoint-postgres>=3.1",
    # Already present underneath langchain-anthropic; declared because C3
    # imports its exception classes by name for the agent node's retry policy,
    # and a transitive dependency is not a promise about what it exports.
    "anthropic>=0.40",

    # --- Module D: the API ---
    # fastapi brings starlette; the request/response contract is pydantic v2
    # models, and `Citation` is reused from app/tools.py rather than redeclared.
    "fastapi>=0.115",
    # Main dependencies rather than dev: the deliverable *is* a running service,
    # `python -m uvicorn app.api:app` is how it runs, and scripts/check_api.py
    # spawns it as a subprocess. [standard] because the documented dev command
    # uses --reload, which needs watchfiles.
    "uvicorn[standard]>=0.30",
    # No httpx entry here on purpose — it is already declared above for the
    # EDGAR client, and it is what both fastapi's TestClient and check_api.py
    # use. Adding it twice would just create two floors to keep in sync.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
